services:
  yolo-seg:
    image: heartexlabs/label-studio-ml-backend:yolo-master
    platform: linux/amd64
    container_name: yolo-seg
    environment:
      - LABEL_STUDIO_URL=http://host.docker.internal:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - ALLOW_CUSTOM_MODEL_PATH=true
    ports:
      - "9090:9090"
    volumes:
      - yolo-data:/data

  mobilesam:
    image: heartexlabs/label-studio-ml-backend:sam-master
    platform: linux/amd64
    container_name: mobilesam
    environment:
      - LABEL_STUDIO_URL=http://host.docker.internal:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - SAM_CHOICE=MobileSAM
    ports:
      - "9091:9090"
    volumes:
      - mobilesam-data:/data

  sam3:
    build: ./ml_backends/sam3
    container_name: sam3
    environment:
      - LABEL_STUDIO_URL=http://host.docker.internal:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - SAM3_MODEL_NAME=${SAM3_MODEL_NAME:-facebook/sam3}
    ports:
      - "9092:9090"
    volumes:
      - sam3-data:/data

volumes:
  yolo-data:
  mobilesam-data:
  sam3-data:
