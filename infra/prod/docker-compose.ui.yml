services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: labelstudio
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - ls-net
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d labelstudio']
            interval: 5s
            timeout: 5s
            retries: 10

    label-studio:
        image: heartexlabs/label-studio:latest
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            - DJANGO_DB=default
            - POSTGRE_HOST=postgres
            - POSTGRE_PORT=5432
            - POSTGRE_NAME=labelstudio
            - POSTGRE_USER=${POSTGRES_USER}
            - POSTGRE_PASSWORD=${POSTGRES_PASSWORD}
            - LABEL_STUDIO_HOST=${LABEL_STUDIO_EXTERNAL_URL}
            - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
            - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME}
            - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD}
        ports:
            - '8080:8080'
        volumes:
            - ls-data:/label-studio/data
        networks:
            - ls-net
        restart: unless-stopped
        healthcheck:
            test:
                ['CMD-SHELL', 'curl -sf http://localhost:8080/health || exit 1']
            interval: 10s
            timeout: 10s
            retries: 15
            start_period: 60s

networks:
    ls-net:
        name: ls-net

volumes:
    postgres-data:
    ls-data:
