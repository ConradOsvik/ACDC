services:
    yolo-seg:
        build:
            context: ../../ml_backends
            dockerfile: yolo/Dockerfile
        container_name: yolo-seg
        restart: unless-stopped
        environment:
            - LABEL_STUDIO_URL=${LABEL_STUDIO_EXTERNAL_URL}
            - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
            - YOLO_WEIGHTS_DIR=${YOLO_WEIGHTS_DIR:-/data/weights}
            - YOLO_CONF=${YOLO_CONF:-0.25}
            - YOLO_TRAIN_EPOCHS=${YOLO_TRAIN_EPOCHS:-50}
            - YOLO_TRAIN_IMGSZ=${YOLO_TRAIN_IMGSZ:-640}
            - LABEL_STUDIO_ML_BACKEND_V2=True
        ports:
            - '9090:9090'
        volumes:
            - yolo-data:/data

    sam3:
        build:
            context: ../../ml_backends
            dockerfile: sam3/Dockerfile
        container_name: sam3
        restart: unless-stopped
        mem_limit: 8g
        environment:
            - LABEL_STUDIO_URL=${LABEL_STUDIO_EXTERNAL_URL}
            - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
            - SAM3_MODEL_PATH=/models/sam3.pt
        ports:
            - '9091:9090'
        volumes:
            - ../../ml_backends/sam3/sam3.pt:/models/sam3.pt:ro
            - sam3-data:/data

volumes:
    yolo-data:
    sam3-data:
