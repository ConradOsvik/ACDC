services:
  yolo-seg:
    build:
      context: ../../ml_backends
      dockerfile: yolo/Dockerfile
    container_name: yolo-seg
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    environment:
      - LABEL_STUDIO_URL=${LABEL_STUDIO_EXTERNAL_URL}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - YOLO_WEIGHTS_DIR=${YOLO_WEIGHTS_DIR:-/data/weights}
      - YOLO_CONF=${YOLO_CONF:-0.25}
      - YOLO_TRAIN_EPOCHS=${YOLO_TRAIN_EPOCHS:-50}
      - YOLO_TRAIN_IMGSZ=${YOLO_TRAIN_IMGSZ:-640}
      - YOLO_TRAIN_BATCH=${YOLO_TRAIN_BATCH:--1}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - LABEL_STUDIO_ML_BACKEND_V2=True
    ports:
      - "9090:9090"
    volumes:
      - yolo-data:/data
      - ../../runs/yolo:/data/runs
    networks:
      - ls-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  sam3:
    build:
      context: ../../ml_backends
      dockerfile: sam3/Dockerfile
    container_name: sam3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    mem_limit: 8g
    environment:
      - LABEL_STUDIO_URL=${LABEL_STUDIO_EXTERNAL_URL}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - SAM3_MODEL_PATH=/models/sam3.pt
    ports:
      - "9091:9090"
    volumes:
      - ../../ml_backends/sam3/sam3.pt:/models/sam3.pt:ro
      - sam3-data:/data
    networks:
      - ls-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 240s

networks:
  ls-net:
    external: true
    name: ls-net

volumes:
  yolo-data:
  sam3-data:
