services:

  yolo-seg:
    build:
      context: ../../ml_backends
      dockerfile: yolo/Dockerfile
    container_name: yolo-seg
    environment:
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - YOLO_MODEL_PATH=${YOLO_MODEL_PATH:-yolo11n-seg.pt}
      - YOLO_CONF=${YOLO_CONF:-0.25}
    ports:
      - "9090:9090"
    volumes:
      - yolo-data:/data
    networks:
      - ls-net

  sam3:
    build:
      context: ../../ml_backends
      dockerfile: sam3/Dockerfile
    container_name: sam3
    mem_limit: 8g
    environment:
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - SAM3_MODEL_PATH=/models/sam3.pt
    ports:
      - "9091:9090"
    volumes:
      - ../../ml_backends/sam3/sam3.pt:/models/sam3.pt:ro
      - sam3-data:/data
    networks:
      - ls-net

networks:
  ls-net:
    external: true
    name: ls-net

volumes:
  yolo-data:
  sam3-data:
