services:

  yolo-seg:
    build:
      context: ../../ml_backends
      dockerfile: yolo/Dockerfile
    container_name: yolo-seg
    env_file:
      - ../../.env
    environment:
      LABEL_STUDIO_URL: http://label-studio:8080
    ports:
      - "9090:9090"
    volumes:
      - yolo-data:/data
      - ../../runs/yolo:/data/runs
    networks:
      - ls-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  sam3:
    build:
      context: ../../ml_backends
      dockerfile: sam3/Dockerfile
    container_name: sam3
    mem_limit: 8g
    env_file:
      - ../../.env
    environment:
      LABEL_STUDIO_URL: http://label-studio:8080
      SAM3_MODEL_PATH: /models/sam3.pt
    ports:
      - "9091:9090"
    volumes:
      - ../../ml_backends/sam3/sam3.pt:/models/sam3.pt:ro
      - sam3-data:/data
    networks:
      - ls-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 240s

networks:
  ls-net:
    external: true
    name: ls-net

volumes:
  yolo-data:
  sam3-data:
