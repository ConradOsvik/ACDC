[project]
name = "acdc-ls-cli"
version = "0.1.0"
description = "CLI and ML backends for the ACDC corrosion annotation pipeline (Label Studio + SAM 3 + YOLO26-seg)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "label-studio-sdk>=2.0.19",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "rich>=13.0",
    "typer>=0.15",
]

[project.scripts]
ls-cli = "ls_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ls_cli"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
